<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Deseos 🎀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎀 Mi Lista de Deseos 🎀</h1>
            <div class="profile-pic-container">
                <img id="profilePic" src="profile.JPG" alt="Tu foto">
            </div>
            <p>Comparte conmigo qué te gustaría recibir</p>
            
            <div id="pinterestSection" style="margin-top: 1rem;">
                <a id="pinterestLink" href="#" target="_blank" class="pinterest-btn">
                    <i class="fab fa-pinterest"></i> Ver mi tablero de Pinterest
                </a>
            </div>

            <button id="adminBtn" class="admin-btn">🔑 Admin</button>
        </div>

        <!-- Modal de contraseña -->
        <div id="passwordModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Acceso de administrador</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="adminPassword">Contraseña:</label>
                        <input type="password" id="adminPassword" placeholder="Ingresa la contraseña" required>
                    </div>
                    <button type="submit" class="add-btn">Desbloquear</button>
                </form>
            </div>
        </div>

        <div class="add-item-section" id="addItemSection" style="display: none;">
            <h2>Agregar un nuevo deseo</h2>
            <form id="addItemForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Nombre del artículo</label>
                        <input type="text" id="title" placeholder="Ej: Chaleco butter yellow" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Rango de precio ($)</label>
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <div style="flex: 1;">
                            <input type="number" id="priceMin" placeholder="Mínimo" min="0" step="1000" required>
                        </div>
                        <span style="color: #be185d; font-weight: 600;">-</span>
                        <div style="flex: 1;">
                            <input type="number" id="priceMax" placeholder="Máximo" min="0" step="1000" required>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="imageurl">Foto del deseo*</label>
                        <input type="file" id="imageFile" accept="image/png,image/jpeg" style="display: none;">
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="url" id="imageurl" placeholder="https://ejemplo.com/imagen.jpg" style="flex: 1;">
                            <button type="button" id="uploadImageBtn" class="add-btn" style="flex: 0; padding: 0.8rem 1rem; background: #fbcfe8; color: #be185d; border: 2px solid #be185d;">Subir</button>
                        </div>
                        <small style="color: #be185d; margin-top: 0.5rem; display: block;">Sube una imagen (PNG/JPG) o pega una URL</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Descripción (opcional)</label>
                    <textarea id="description" placeholder="Describe qué buscas, colores, tamaños, etc."></textarea>
                </div>

                <div class="form-group">
                    <label>Links a tiendas (opcional)</label>
                    <div id="shopLinksContainer">
                        <div class="shop-link-input">
                            <input type="text" placeholder="Nombre de la tienda" class="shop-name">
                            <input type="url" placeholder="URL del producto" class="shop-url">
                            <button type="button" class="remove-link-btn" onclick="removeShopLink(this)" style="display: none;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <button type="button" id="addMoreLinksBtn" class="add-more-links-btn">
                        <i class="fas fa-plus"></i> Agregar otro link
                    </button>
                </div>

                <button type="submit" class="add-btn">
                    <i class="fas fa-plus"></i> Agregar a mi lista
                </button>
            </form>
        </div>

        <div class="filter-section" id="filterSection" style="display: none;">
            <h3>Filtrar y ordenar</h3>
            <div class="price-filter">
                <div>
                    <label style="font-size: 0.9rem;">Rango de precio:</label>
                    <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
                        <div>
                            <input type="range" id="priceMinRange" min="0" max="1000000" value="0" step="10000" style="width: 150px;">
                            <span style="font-size: 0.85rem; color: #be185d;">$<span id="priceMinValue">0</span></span>
                        </div>
                        <span style="color: #be185d;">-</span>
                        <div>
                            <input type="range" id="priceMaxRange" min="0" max="1000000" value="1000000" step="10000" style="width: 150px;">
                            <span style="font-size: 0.85rem; color: #be185d;">$<span id="priceMaxValue">1.000.000</span></span>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 1.5rem;">
                    <label style="font-size: 0.9rem;">Ordenar por:</label>
                    <select id="sortSelect" style="margin-top: 0.5rem; padding: 0.6rem; border: 1px solid #fbcfe8; border-radius: 8px; color: #6b4d6d;">
                        <option value="newest">Más nuevos primero</option>
                        <option value="oldest">Más antiguos primero</option>
                        <option value="priceLow">Menor precio</option>
                        <option value="priceHigh">Mayor precio</option>
                        <option value="random">Aleatorio</option>
                    </select>
                </div>

                <button id="resetFilter" class="reset-btn" style="margin-top: 1rem;">Limpiar filtros</button>
            </div>
        </div>

        <div id="itemsContainer" class="items-grid"></div>

        <div class="footer">
            <p>✨ Comparte el link de esta página con tus amigos y familia ✨</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
