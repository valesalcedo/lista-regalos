<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Deseos 🎀</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎀 Mi Lista de Deseos 🎀</h1>
            <div class="profile-pic-container">
                <img id="profilePic" src="profile.JPG" alt="Tu foto">
            </div>
            <p>Comparte conmigo qué te gustaría recibir</p>
            <button id="adminBtn" class="admin-btn">🔑 Admin</button>
        </div>

        <!-- Modal de contraseña -->
        <div id="passwordModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Acceso de administrador</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="adminPassword">Contraseña:</label>
                        <input type="password" id="adminPassword" placeholder="Ingresa la contraseña" required>
                    </div>
                    <button type="submit" class="add-btn">Desbloquear</button>
                </form>
            </div>
        </div>

        <div class="add-item-section" id="addItemSection" style="display: none;">
            <h2>Agregar un nuevo deseo</h2>
            <form id="addItemForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Nombre del artículo</label>
                        <input type="text" id="title" placeholder="Ej: Chaleco butter yellow" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Precio aproximado ($)</label>
                        <input type="number" id="price" placeholder="50000" min="0" step="1000" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="imageurl">Foto del deseo*</label>
                        <input type="file" id="imageFile" accept="image/png,image/jpeg" style="display: none;">
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="url" id="imageurl" placeholder="https://ejemplo.com/imagen.jpg" style="flex: 1;">
                            <button type="button" id="uploadImageBtn" class="add-btn" style="flex: 0; padding: 0.8rem 1rem; background: #fbcfe8; color: #be185d; border: 2px solid #be185d;">Subir</button>
                        </div>
                        <small style="color: #be185d; margin-top: 0.5rem; display: block;">Sube una imagen (PNG/JPG) o pega una URL</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Descripción (opcional)</label>
                    <textarea id="description" placeholder="Describe qué buscas, colores, tamaños, etc."></textarea>
                </div>

                <div class="form-group">
                    <label for="shopLinks">Links a tiendas (opcional)</label>
                    <textarea id="shopLinks" placeholder="Ej: Amazon - https://amazon.com/producto&#10;Falabella - https://falabella.com/producto&#10;Tienda X - https://tiendax.com/producto&#10;&#10;Uno por línea con el formato: Nombre - URL"></textarea>
                </div>

                <button type="submit" class="add-btn">
                    <i class="fas fa-plus"></i> Agregar a mi lista
                </button>
            </form>
        </div>

        <div class="filter-section">
            <h3>Filtrar por precio</h3>
            <div class="price-filter">
                <label>
                    <input type="range" id="priceRange" min="0" max="500000" value="500000" step="10000">
                    <span>Hasta $<span id="priceValue">500.000</span></span>
                </label>
                <button id="resetFilter" class="reset-btn">Limpiar filtro</button>
            </div>
        </div>

        <div id="itemsContainer" class="items-grid"></div>

        <div class="footer">
            <p>✨ Comparte el link de esta página con tus amigos y familia ✨</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
